services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:8.12.0
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false  # local development only
      - cluster.routing.allocation.disk.threshold_enabled=false  # do not go read-only on nearly full dev disks
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 30

  grobid:
    # CRF-only image (~300 MB of models, runs on CPU). For higher accuracy use
    # grobid/grobid:0.8.1, which adds deep-learning models (bigger, slower on CPU).
    image: lfoppiano/grobid:0.8.1
    environment:
      # Works around a JDK crash in the image on cgroup v2 hosts ("CgroupInfo.getMountPoint() ... is null").
      - JAVA_OPTS=-XX:-UseContainerSupport
    ports:
      - "8070:8070"

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      GROBID_URL: http://grobid:8070
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      grobid:
        condition: service_started

volumes:
  mysql-data:
